# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (packages/api_tests)
        working-directory: packages/api_tests
        run: npm install
      - name: Install (packages/smoke_tests)
        working-directory: packages/smoke_tests
        run: npm install
      - name: Install (packages/system_critical_flows)
        working-directory: packages/system_critical_flows
        run: npm install
      - name: Install (packages/testing)
        working-directory: packages/testing
        run: npm install
